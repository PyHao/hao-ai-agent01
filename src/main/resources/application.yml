spring:
  application:
    name: hao-ai-agent
  profiles:
#    active: local
    active: local,pgvector
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:7b
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        max-document-batch-size: 10000 # 可选：每个批次的最大文档数
  datasource:
#    url: jdbc:postgresql://localhost:5432/postgres
    url: jdbc:postgresql://localhost:5432/ragdb
    username: postgres
    password: postgres

app:
  pgvector:
    load-documents: true


server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi????
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.hao.haoaiagent.controller
# knife4j???????????????
knife4j:
  enable: true
  setting:
    language: zh_cn
